minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "@rolldown/*"
  - "@vercel/*"
  - "@workflow/*"
  - ai
  - experimental-ai-sdk-code-mode
  - eve
  - nitro
  - rolldown
  - workflow
allowBuilds:
  esbuild: true
  sharp: false
  just-bash: true
  '@mongodb-js/zstd': false
  node-liblzma: false
ignoredBuiltDependencies:
  - "@mongodb-js/zstd"
  - node-liblzma
onlyBuiltDependencies:
  - esbuild
  - "@libsql/client"
# Compatibility for eve releases with an incomplete runtime manifest.
packageExtensions:
  "eve@>=0.6.0-beta.13 <=0.7.0":
    dependencies:
      oxc-parser: 0.134.0
